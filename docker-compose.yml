# Baseada no Compose da EC2. Segredos devem ficar no .env local.
# Preserva o prefixo dos volumes mesmo ao clonar em outra pasta.
name: segundo-cerebro

networks:
  cerebro-net:
    driver: bridge

volumes:
  n8n_data:
  redis_data:
  evolution_data:
  postgres_data:

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}
    volumes:
      - redis_data:/data
    networks:
      - cerebro-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      - POSTGRES_DB=evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cerebro-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 3s
      retries: 5

  n8n:
    # Versão do executável confirmada na EC2, em vez do antigo latest.
    image: n8nio/n8n:2.29.10
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:?Defina N8N_HOST no .env}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?Restaure a chave original do n8n}
      - DB_TYPE=sqlite
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - cerebro-net
    depends_on:
      redis:
        condition: service_healthy

  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=https://${EVOLUTION_HOST:?Defina EVOLUTION_HOST no .env}
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?Defina EVOLUTION_API_KEY no .env}
      - QRCODE_LIMIT=30
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=${EVOLUTION_DATABASE_CONNECTION_URI:?Defina a URI do PostgreSQL no .env}
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - LOG_LEVEL=ERROR,WARN,INFO,WEBHOOKS
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - cerebro-net
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - cerebro-net
    depends_on:
      - n8n
      - evolution
