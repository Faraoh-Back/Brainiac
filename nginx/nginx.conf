# Substitua os domínios de exemplo pelos configurados no .env.
events { worker_connections 1024; }

http {
    server {
        listen 80;
        server_name n8n.example.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name n8n.example.com;
        ssl_certificate /etc/nginx/ssl/n8n_fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/n8n_privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50M;
        location / { proxy_pass http://n8n:5678; }
    }
    server {
        listen 80;
        server_name evolution.example.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name evolution.example.com;
        ssl_certificate /etc/nginx/ssl/evolution_fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/evolution_privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50M;
        location / { proxy_pass http://evolution:8080; }
    }
}
